name: Build Windows Setup Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri-windows:
    name: Build Tauri Desktop App for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3


      - name: Install NSIS
        run: choco install nsis -y

      # Setup Java (for Spring Boot)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Rust (for Tauri)
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Setup Node.js and Yarn
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18


      - name: Install Yarn
        working-directory: ./console
        run: corepack enable


      - name: Install dependencies
        working-directory: ./console
        run: yarn install --immutable

      # Build React frontend inside console/
      - name: Build React Frontend (console/)
        working-directory: ./console
        run: yarn build



#      - name: Install Tauri CLI
#        working-directory: ./console
#        run: cargo install tauri-cli
#

      # Build Spring Boot Backend (with embedded frontend)
      - name: Build Spring Boot App
        run: ./mvnw clean package

      # Copy Spring Boot jar to Tauri bin/
      - name: Copy Spring Boot JAR to Tauri project
        run: |
          mkdir -p console/src-tauri/bin
          cp target/*.jar console/src-tauri/bin/app.jar



      # Build Tauri Windows Installer
      - name: Build Tauri App
        working-directory: ./console
        run: yarn tauri build

      # Upload Installer
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            console/src-tauri/target/release/bundle/msi/*.msi
            console/src-tauri/target/release/bundle/msi/*.exe